name: Publish Docker images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: hephaestus
            context: .
            suffix: ""
          - name: forge
            context: ./forge
            suffix: /forge
        platform:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.platform.runner }}
    outputs:
      hephaestus-amd64: ${{ steps.digest.outputs.hephaestus-amd64 }}
      hephaestus-arm64: ${{ steps.digest.outputs.hephaestus-arm64 }}
      forge-amd64: ${{ steps.digest.outputs.forge-amd64 }}
      forge-arm64: ${{ steps.digest.outputs.forge-arm64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}${{ matrix.image.suffix }}

      - uses: docker/build-push-action@v6
        id: push
        with:
          context: ${{ matrix.image.context }}
          platforms: linux/${{ matrix.platform.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository }}${{ matrix.image.suffix }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }},mode=max

      - name: Export digest
        id: digest
        if: github.event_name != 'pull_request'
        run: echo "${{ matrix.image.name }}-${{ matrix.platform.arch }}=${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"

  manifest:
    if: github.event_name != 'pull_request'
    needs: build
    strategy:
      matrix:
        image:
          - name: hephaestus
            suffix: ""
          - name: forge
            suffix: /forge
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}${{ matrix.image.suffix }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Create multi-arch manifest
        run: |
          DIGEST_AMD64="${{ needs.build.outputs[format('{0}-amd64', matrix.image.name)] }}"
          DIGEST_ARM64="${{ needs.build.outputs[format('{0}-arm64', matrix.image.name)] }}"
          IMAGE="${{ env.REGISTRY }}/${{ github.repository }}${{ matrix.image.suffix }}"

          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "${IMAGE}@${DIGEST_AMD64}" \
            "${IMAGE}@${DIGEST_ARM64}"
