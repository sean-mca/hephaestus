[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.dependencies]
# ONNX inference
ort = "2.0.0-rc.13"
ndarray = "0.17"

# Tokenization
tokenizers = "0.23"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Configuration
envy = "0.4"

# Instrumentation (prep for Phase 2)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Dev/test dependencies
hf-hub = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
mockall = "0.15"
tempfile = "3"
