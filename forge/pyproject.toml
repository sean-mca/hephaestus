[project]
name = "forge"
version = "0.1.0"
description = "ONNX model conversion service for Hephaestus"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "optimum[onnxruntime]>=2.0",
    "onnx>=1.16",
    "onnxruntime>=1.28",
    "opendal>=0.47",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
